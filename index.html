<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ivy &amp; Ryan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#8ED2F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<!-- APP START -->
<title>Ivy and Ryan's Play Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;700;800&display=swap">
<style>
:root {
  /* Layout: one fixed, full-screen playroom on a garden sky. Every screen is a top bar,
     Pip's spoken prompt, then one big touch stage. Activities are chunky toy blocks. */
  --sky-top: #8ED2F2;
  --sky-low: #DFF3FB;
  --hill-far: #ADE08A;
  --hill-near: #7DCB5B;
  --sun: #FFD447;
  --sun-halo: rgba(255, 212, 71, .3);
  --cloud: rgba(255, 255, 255, .9);
  --stars-on: 0;
  --moon-cut: transparent;
  --ink: #1C2A45;
  --ink-soft: #52627F;
  --paper: #FFFFFF;
  --paper-edge: #CADAE8;
  --shade: rgba(28, 42, 69, .16);
  --scrim: rgba(18, 28, 56, .5);
  --guide-fill: #E2ECF6;
  --guide-dash: #7D99B8;
  --rule: #9AB1C9;
  --rule-mid: #E59090;
  --hl: #FFE27A;
  --hl-ink: #1C2A45;
  --carve: rgba(255, 255, 255, .3);
  --red: #F25F5C;    --red-deep: #C4413F;    --red-ink: #C4413F;
  --yellow: #FFC53D; --yellow-deep: #C98E0B; --yellow-ink: #A87500;
  --green: #36BC76;  --green-deep: #1F8F57;  --green-ink: #1E8A53;
  --blue: #4B8CF5;   --blue-deep: #2A66C8;   --blue-ink: #2A66C8;
  --pink: #EE78B6;   --pink-deep: #C2528D;   --pink-ink: #B8467F;
  --orange: #FF9640; --orange-deep: #D06A18; --orange-ink: #B85A0C;
  --purple: #9B7BF2; --purple-deep: #6C4FC6; --purple-ink: #6A4BC4;
  --teal: #1FA9A1;   --teal-deep: #137C76;   --teal-ink: #0E7A74;
  --wood: #E0A867;   --wood-deep: #A9743A;   --wood-ink: #8A5A24;
  --navy: #4655B8;   --navy-deep: #2F3C8C;   --navy-ink: #3A4AA8;
  --nb-paper: #FFFEFA; --nb-rule: #8CB3E0; --nb-base: #E07A7A; --nb-margin: #F09A9A;
  --sil: brightness(0) opacity(.8);
  --good: #2EAD68;
  --white: #FFFFFF;
  --glyph-dark: #1C2A45;
  --flame: #FF8A1F;
  --pip: #FFB52E; --pip-belly: #FFE4A1; --pip-wing: #EF9416; --pip-beak: #F2662A; --pip-eye: #1C2A45; --pip-cheek: #FF94A8;
  --sc-day-top: #9ED9F5; --sc-day-low: #E9F8FD; --sc-grass: #86CF62;
  --sc-night-top: #101C45; --sc-night-low: #2F4A8A; --sc-grass-night: #2B5A44;
  --sc-dusk-top: #4F55A3; --sc-dusk-low: #F4AE86; --sc-grass-dusk: #5E8C55;
  --sc-gold-top: #FFC07A; --sc-gold-low: #FFEFCB;
  --sc-rain-top: #8FA3B8; --sc-rain-low: #D6E1EB;
  --sc-sea: #3FA7D6; --sc-sea-night: #1F4E7A; --sc-sand: #F4DB98; --sc-sand-night: #8E7E58;
  --sc-snow: #FFFFFF; --sc-snow-top: #C9DDF0;
  --sc-moon: #CBCFDB;
  --sc-star: #FFF3C2;
  --font-play: "Grandstander", "Chalkboard SE", "Comic Sans MS", "Marker Felt", system-ui, sans-serif;
  --font-read: "Andika", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --radius: 26px;
  --gap: clamp(12px, 2.2vmin, 22px);
  --tile: clamp(92px, min(20vmin, 22vw), 196px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #0C1433; --sky-low: #22366A; --hill-far: #2A6446; --hill-near: #1F4F37;
    --sun: #F3EFD0; --sun-halo: rgba(243, 239, 208, .1); --cloud: rgba(255, 255, 255, .07);
    --stars-on: 1; --moon-cut: #0E1838;
    --ink: #F3F5FF; --ink-soft: #B3BFDE; --paper: #17234A; --paper-edge: #0A1230;
    --shade: rgba(0, 0, 0, .35); --scrim: rgba(4, 8, 22, .66);
    --guide-fill: #26365F; --guide-dash: #8399CB; --rule: #5B70A2; --rule-mid: #C27474;
    --hl: #FFD54A; --carve: rgba(255, 255, 255, .24);
    --red-ink: #FF8582; --yellow-ink: #FFD261; --green-ink: #5BD993; --blue-ink: #86B2FF; --pink-ink: #FF9ACD;
    --orange-ink: #FFB06E; --purple-ink: #C3AEFF; --teal-ink: #5EDCD3; --wood-ink: #F0C48E; --navy-ink: #A9B5FF;
    --nb-paper: #1A2550; --nb-rule: #4F6CAA; --nb-base: #B06A6A; --nb-margin: #8C5A6C; --sil: brightness(0) invert(.88);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #0C1433; --sky-low: #22366A; --hill-far: #2A6446; --hill-near: #1F4F37;
  --sun: #F3EFD0; --sun-halo: rgba(243, 239, 208, .1); --cloud: rgba(255, 255, 255, .07);
  --stars-on: 1; --moon-cut: #0E1838;
  --ink: #F3F5FF; --ink-soft: #B3BFDE; --paper: #17234A; --paper-edge: #0A1230;
  --shade: rgba(0, 0, 0, .35); --scrim: rgba(4, 8, 22, .66);
  --guide-fill: #26365F; --guide-dash: #8399CB; --rule: #5B70A2; --rule-mid: #C27474;
  --hl: #FFD54A; --carve: rgba(255, 255, 255, .24);
  --red-ink: #FF8582; --yellow-ink: #FFD261; --green-ink: #5BD993; --blue-ink: #86B2FF; --pink-ink: #FF9ACD;
    --orange-ink: #FFB06E; --purple-ink: #C3AEFF; --teal-ink: #5EDCD3; --wood-ink: #F0C48E; --navy-ink: #A9B5FF;
    --nb-paper: #1A2550; --nb-rule: #4F6CAA; --nb-base: #B06A6A; --nb-margin: #8C5A6C; --sil: brightness(0) invert(.88);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky-low); color: var(--ink); font-family: var(--font-play); font-size: 16px; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
button { -webkit-appearance: none; appearance: none; font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
svg { display: block; }
.emo { font-family: var(--font-emoji); line-height: 1; }

#app {
  position: fixed; inset: 0; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 72%);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}

/* ---------- garden backdrop ---------- */
.backdrop { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.stars-sky {
  position: absolute; inset: 0 0 35% 0; opacity: var(--stars-on);
  background-image:
    radial-gradient(2px 2px at 8% 14%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(2px 2px at 22% 32%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(3px 3px at 36% 10%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(2px 2px at 48% 26%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(2px 2px at 61% 8%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(3px 3px at 70% 36%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(2px 2px at 88% 44%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(2px 2px at 14% 52%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(2px 2px at 54% 48%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(3px 3px at 94% 18%, var(--sc-star) 50%, transparent 52%);
}
.sun {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 5vmin); right: max(6vmin, env(safe-area-inset-right, 0px));
  width: 14vmin; height: 14vmin; border-radius: 50%; background: var(--sun);
  box-shadow: 0 0 0 2.2vmin var(--sun-halo), 0 0 0 4.6vmin var(--sun-halo);
}
.sun::after { content: ""; position: absolute; width: 100%; height: 100%; border-radius: 50%; left: 32%; top: -14%; background: var(--moon-cut); }
.cloud { position: absolute; width: 22vmin; height: 7vmin; background: var(--cloud); border-radius: 999px; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
.cloud::before { width: 9vmin; height: 9vmin; left: 3.4vmin; top: -4.4vmin; }
.cloud::after { width: 12vmin; height: 12vmin; left: 8.6vmin; top: -6.4vmin; }
.cloud.c1 { top: 18vmin; left: 4vw; animation: drift 70s linear infinite alternate; }
.cloud.c2 { top: 34vmin; left: 52vw; transform: scale(.7); animation: drift 90s linear infinite alternate-reverse; }
.hill { position: absolute; border-radius: 50%; }
.hill.far { width: 125vw; height: 36vmin; left: -35vw; bottom: -22vmin; background: var(--hill-far); }
.hill.near { width: 115vw; height: 32vmin; right: -40vw; bottom: -21vmin; background: var(--hill-near); }

/* ---------- screens ---------- */
#view { position: absolute; inset: 0; }
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; gap: clamp(8px, 1.6vmin, 16px);
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex: none; }
.grow { flex: 1; min-width: 0; }
.round {
  width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--paper); color: var(--ink); box-shadow: 0 6px 0 var(--paper-edge); transition: transform .08s, box-shadow .08s;
}
.round svg { width: 34px; height: 34px; }
.round.pressed { transform: translateY(4px); box-shadow: 0 2px 0 var(--paper-edge); }
.round.off { opacity: .35; pointer-events: none; }
.act-title { margin: 0 4px; font-size: clamp(1.3rem, 3vmin, 1.9rem); font-weight: 800; color: var(--ci); }
.modes { flex: 1; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-width: 0; }
.mode {
  min-height: 58px; padding: 0 20px 0 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 10px;
  background: var(--paper); box-shadow: 0 5px 0 var(--paper-edge); font-weight: 700; font-size: clamp(1rem, 2.3vmin, 1.3rem);
  transition: transform .08s;
}
.mode.pressed { transform: translateY(3px); }
.mode-ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--guide-fill); font-family: var(--font-read), var(--font-emoji); font-weight: 700; font-size: 1.15rem; line-height: 1; }
.mode.on { background: var(--c); color: var(--g); box-shadow: 0 5px 0 var(--cd); }
.mode.on .mode-ic { background: var(--carve); }
.stars-pill {
  display: inline-flex; align-items: center; gap: 8px; height: 58px; padding: 0 20px 0 12px; border-radius: 999px; flex: none;
  background: var(--paper); box-shadow: 0 5px 0 var(--paper-edge); font-weight: 800; font-size: 1.55rem; font-variant-numeric: tabular-nums;
}
.stars-pill svg { width: 38px; height: 38px; }
.stars-pill.bump { animation: bump .5s; }

/* Pip and the speech bubble */
.prompt { display: flex; align-items: center; gap: 16px; min-height: 80px; flex: none; min-width: 0; }
.pip-btn { width: clamp(66px, 10.5vmin, 100px); flex: none; }
.pip-btn svg { width: 100%; height: auto; overflow: visible; }
.pip-btn.hop svg, .hop { animation: hop .6s; }
.pip-eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
.bubble {
  position: relative; min-width: 0; max-width: 100%; background: var(--paper); border-radius: 26px; padding: 12px 22px;
  font-weight: 700; font-size: clamp(1.2rem, 3.1vmin, 1.95rem); line-height: 1.2; box-shadow: 0 5px 0 var(--paper-edge); text-wrap: balance;
}
.bubble::before { content: ""; position: absolute; left: -13px; top: 50%; margin-top: -12px; border: 12px solid transparent; border-left: 0; border-right: 14px solid var(--paper); }
.bubble.pop { animation: bubblePop .35s; }

.stage { flex: 1; min-height: 0; width: 100%; max-width: 1200px; margin: 0 auto; position: relative; display: flex; flex-direction: column; align-items: center; gap: var(--gap); overflow-y: auto; overflow-x: hidden; padding: 4px 4px 14px; }
.stage > :first-child { margin-top: auto; }
.stage > :last-child { margin-bottom: auto; }

/* ---------- shared pieces ---------- */
.card { background: var(--paper); border-radius: var(--radius); box-shadow: 0 8px 0 var(--paper-edge); }
button.card { transition: transform .1s, box-shadow .1s; }
button.card.pressed { transform: translateY(5px); box-shadow: 0 3px 0 var(--paper-edge); }
.choices { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--gap) * 1.3); padding-bottom: 12px; max-width: 100%; }
.tile {
  width: var(--tile); height: var(--tile); border-radius: var(--radius); background: var(--c); color: var(--g); position: relative;
  box-shadow: 0 10px 0 var(--cd), 0 16px 20px var(--shade); display: grid; place-items: center;
  font-family: var(--font-read); font-weight: 700; font-size: calc(var(--tile) * .56); line-height: 1; transition: transform .1s, box-shadow .1s, opacity .2s;
}
.tile::after { content: ""; position: absolute; inset: 8px; border-radius: calc(var(--radius) - 8px); border: 3px solid var(--carve); pointer-events: none; }
.tile.pressed { transform: translateY(6px); box-shadow: 0 4px 0 var(--cd), 0 6px 10px var(--shade); }
.tile.used { opacity: .2; transform: scale(.85); pointer-events: none; }
.pic {
  width: var(--tile); min-height: var(--tile); border-radius: var(--radius); background: var(--paper); box-shadow: 0 10px 0 var(--paper-edge);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; transition: transform .1s, box-shadow .1s;
}
.pic.pressed { transform: translateY(6px); box-shadow: 0 4px 0 var(--paper-edge); }
.pic .emo { font-size: calc(var(--tile) * .5); line-height: 1.1; }
.pic .lbl { font-family: var(--font-read); font-weight: 700; font-size: calc(var(--tile) * .17); color: var(--ink); text-align: center; line-height: 1.1; }
.pill-btn {
  min-height: 60px; padding: 0 24px 0 18px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--c, var(--blue)); color: var(--g, var(--white)); box-shadow: 0 5px 0 var(--cd, var(--blue-deep)); font-weight: 800; font-size: clamp(1.05rem, 2.4vmin, 1.35rem);
  transition: transform .08s;
}
.pill-btn .ic svg { width: 28px; height: 28px; }
.pill-btn.pressed { transform: translateY(3px); }
.pill-btn.ghost { background: var(--paper); color: var(--ink); box-shadow: 0 5px 0 var(--paper-edge); }
.pill-btn.alt { background: var(--yellow); color: var(--glyph-dark); box-shadow: 0 5px 0 var(--yellow-deep); }
.hint-ic { width: 44px; color: var(--ink-soft); flex: none; }

/* ---------- start ---------- */
.start { align-items: center; justify-content: center; gap: clamp(14px, 3vmin, 30px); text-align: center; }
.start > :first-child { margin-top: auto; }
.start > :last-child { margin-bottom: auto; }
.start-hero { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 3vmin, 28px); flex-wrap: wrap; }
.start-pip { width: clamp(120px, 24vmin, 220px); animation: bob 3s ease-in-out infinite; }
.start-pip svg { width: 100%; height: auto; overflow: visible; }
.logo { margin: 0; line-height: .92; text-align: left; font-weight: 800; }
.logo-small { display: block; font-size: clamp(1.6rem, 5vmin, 3rem); color: var(--ink); }
.logo-big { display: block; font-size: clamp(2.5rem, 10vmin, 6rem); letter-spacing: .01em; }
.logo-big span { display: inline-block; text-shadow: 0 .06em 0 var(--paper); }
.logo-big span:nth-child(odd) { transform: rotate(-3deg); }
.logo-big span:nth-child(even) { transform: rotate(3deg) translateY(.03em); }
.start-card { background: var(--paper); border-radius: 36px; padding: clamp(18px, 3.5vmin, 34px) clamp(18px, 4vmin, 44px); box-shadow: 0 10px 0 var(--paper-edge); display: grid; gap: clamp(10px, 2vmin, 18px); justify-items: center; max-width: 100%; }
.start-ask { margin: 0; font-size: clamp(1.5rem, 4.4vmin, 2.5rem); font-weight: 800; }
.ages { display: flex; gap: clamp(12px, 2.4vmin, 24px); flex-wrap: wrap; justify-content: center; }
.age {
  width: clamp(92px, 16vmin, 156px); height: clamp(104px, 18vmin, 176px); border-radius: 28px; background: var(--c); color: var(--g);
  box-shadow: 0 9px 0 var(--cd); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 9%; gap: 6%;
  transition: transform .1s, box-shadow .1s;
}
.age.pressed { transform: translateY(6px); box-shadow: 0 3px 0 var(--cd); }
.age.last { outline: 5px solid var(--ink); outline-offset: 4px; }
.age-n { font-family: var(--font-read); font-weight: 700; font-size: clamp(2.4rem, 7.6vmin, 4.4rem); line-height: 1; }
.candles { display: flex; gap: 7px; height: 30%; align-items: flex-end; }
.candle { width: 9px; height: 62%; background: var(--white); border: 2px solid var(--cd); border-radius: 3px; position: relative; }
.candle::before {
  content: ""; position: absolute; left: 50%; bottom: calc(100% + 2px); width: 12px; height: 16px; margin-left: -6px;
  background: var(--flame); border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; box-shadow: 0 0 10px var(--flame);
  animation: flicker 1.1s ease-in-out infinite alternate; transform-origin: 50% 100%;
}
.start-note { margin: 0; font-family: var(--font-read); font-size: clamp(1rem, 2.4vmin, 1.25rem); color: var(--ink-soft); }

/* ---------- home ---------- */
.home .prompt { min-height: 0; }
.sticker-btn {
  height: 64px; padding: 0 18px 0 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; flex: none;
  background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge); font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums;
}
.sticker-btn .sb-emo { font-family: var(--font-emoji); font-size: 2.2rem; }
.sticker-btn .star-ic svg { width: 34px; height: 34px; }
.sticker-btn.pressed { transform: translateY(4px); }
.hold-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
.gear { position: relative; width: 56px; height: 56px; }
.gear .ic svg { width: 30px; height: 30px; }
.hold-ring { position: absolute; inset: -5px; pointer-events: none; }
.hold-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.hold-ring circle { fill: none; stroke: var(--blue); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 189; stroke-dashoffset: 189; }
.gear.holding .hold-ring circle { animation: ring 1.6s linear forwards; }
.gear.nope { animation: shake .45s; }
.hold-lbl { font-family: var(--font-read); font-size: .8rem; font-weight: 700; color: var(--ink-soft); }
.blocks {
  flex: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
  gap: clamp(16px, 3.6vmin, 40px) clamp(14px, 3vw, 36px); padding-block: 8px 28px;
  --bs: clamp(96px, min(16.5vw, 19vh), 210px);
}
@media (orientation: landscape) { .blocks { --bs: clamp(96px, min(16.5vw, 26vh), 210px); } }
.block { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.block-face {
  width: var(--bs); height: var(--bs); border-radius: 30px; background: var(--c); color: var(--g); position: relative;
  box-shadow: inset 0 0 0 calc(var(--bs) * .055) var(--carve), 0 14px 0 var(--cd), 0 22px 26px var(--shade);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2%;
  font-family: var(--font-read); font-weight: 700; font-size: calc(var(--bs) * .34); line-height: 1; transition: transform .12s, box-shadow .12s;
}
.block.pressed .block-face { transform: translateY(10px); box-shadow: inset 0 0 0 calc(var(--bs) * .055) var(--carve), 0 4px 0 var(--cd), 0 8px 12px var(--shade); }
.block-face .face-svg { display: block; width: 60%; }
.block-face .face-svg svg { width: 100%; height: auto; }
.block-face .face-emo { font-family: var(--font-emoji); font-size: .9em; }
.block-face .sm { font-size: .62em; }
.block-face .trio { font-size: .7em; letter-spacing: -.06em; }
.block-face .duo { font-size: .95em; }
.block-face .solo { font-size: 1.6em; }
.block-label { font-size: min(clamp(1.1rem, 3.3vmin, 2rem), calc(var(--bs) * .17)); font-weight: 800; color: var(--ink); white-space: nowrap; }

/* ---------- letters ---------- */
.lt-learn { width: 100%; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); align-items: center; }
.lt-card { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: clamp(14px, 3vmin, 30px); }
.lt-main { display: flex; align-items: center; justify-content: center; gap: 6%; width: 100%; flex-wrap: wrap; }
.lt-letters { font-family: var(--font-read); font-weight: 700; font-size: clamp(4.8rem, 19vmin, 11rem); line-height: 1.05; color: var(--ci); display: flex; gap: .1em; align-items: baseline; }
.lt-pic { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lt-pic .emo { font-size: clamp(3.8rem, 14vmin, 8.5rem); }
.lt-word { font-family: var(--font-read); font-size: clamp(1.7rem, 4.8vmin, 2.9rem); font-weight: 700; color: var(--ink); }
.lt-word b { color: var(--ci); }
.lt-nav { display: flex; gap: 18px; }
.lt-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(6px, 1.2vmin, 12px); }
.lt-key {
  aspect-ratio: 1 / 1; min-height: 44px; border-radius: 16px; background: var(--c); color: var(--g); box-shadow: 0 5px 0 var(--cd);
  font-family: var(--font-read); font-weight: 700; font-size: clamp(1.3rem, 4.2vmin, 2.5rem); display: grid; place-items: center; transition: transform .08s;
}
.lt-key.pressed { transform: translateY(3px); }
.lt-key.on { outline: 4px solid var(--ink); outline-offset: 2px; }
.find-pic { padding: 12px 36px; display: flex; flex-direction: column; align-items: center; }
.find-pic .emo { font-size: clamp(4rem, 16vmin, 9rem); }

/* ---------- words ---------- */
.word-card { padding: 8px 34px; display: flex; align-items: center; gap: 18px; }
.word-big { font-family: var(--font-read); font-weight: 700; font-size: clamp(3rem, 12vmin, 7rem); color: var(--ink); line-height: 1.15; }
.build { display: flex; align-items: center; justify-content: center; gap: calc(var(--gap) * 1.5); flex-wrap: wrap; }
.build-pic { padding: 10px 22px; display: flex; align-items: center; gap: 8px; }
.build-pic .emo { font-size: clamp(4rem, 15vmin, 8.5rem); }
.slots { display: flex; gap: 12px; }
.slot {
  width: calc(var(--tile) * .78); height: calc(var(--tile) * .9); border-radius: 22px; border: 4px dashed var(--rule); display: grid; place-items: center;
  font-family: var(--font-read); font-weight: 700; font-size: calc(var(--tile) * .5); color: var(--ink-soft); background: var(--paper);
}
.slot.hint span { opacity: .3; }
.slot.filled { border: 4px solid var(--cd); background: var(--c); color: var(--g); box-shadow: 0 6px 0 var(--cd); }
.slot.filled span { opacity: 1; }
.tiles-sm { --tile: clamp(78px, min(14vmin, 18vw), 136px); }
.pop-stage { position: absolute; inset: 0; overflow: hidden; }
.balloon {
  --bw: clamp(96px, 17vmin, 168px);
  position: absolute; top: 100%; width: var(--bw); margin-left: calc(var(--bw) / -2);
  display: flex; flex-direction: column; align-items: center; animation: rise linear infinite;
}
.balloon-body {
  width: var(--bw); height: calc(var(--bw) * 1.18); border-radius: 50% 50% 47% 47% / 56% 56% 44% 44%; position: relative;
  background: radial-gradient(circle at 32% 26%, var(--carve) 0 9%, transparent 10%), var(--c); color: var(--g);
  box-shadow: inset -10px -14px 0 var(--shade);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; animation: sway 3.2s ease-in-out infinite;
}
.balloon-body::after { content: ""; position: absolute; bottom: -10px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top: 0; border-bottom: 12px solid var(--cd); }
.balloon-string { width: 2px; height: calc(var(--bw) * .55); background: var(--ink-soft); opacity: .55; margin-top: 10px; }
.balloon-word { font-family: var(--font-read); font-weight: 700; font-size: calc(var(--bw) * .3); line-height: 1; }
.balloon.pics .balloon-word { font-size: calc(var(--bw) * .19); }
.balloon .emo { font-size: calc(var(--bw) * .36); line-height: 1.1; }
.balloon.popped { animation-play-state: paused; pointer-events: none; }
.balloon.popped .balloon-body { animation: popOut .35s forwards; }
.balloon.popped .balloon-string { opacity: 0; }

/* ---------- numbers ---------- */
.mat { width: min(100%, 920px); flex: 1 1 auto; min-height: 170px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2.4vmin 3.4vmin; padding: 3vmin; }
.mat-big { --os: clamp(4rem, 15vmin, 8rem); }
.mat-mid { --os: clamp(3rem, 11vmin, 6rem); }
.mat-small { --os: clamp(2.4rem, 8.4vmin, 4.6rem); }
.obj { position: relative; font-size: var(--os); transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); }
.obj .emo { display: block; }
.badge {
  position: absolute; right: -.18em; top: -.18em; min-width: 1.5em; height: 1.5em; padding: 0 .3em; border-radius: 999px; display: grid; place-items: center;
  font-family: var(--font-read); font-weight: 700; font-size: calc(var(--os) * .3); background: var(--c); color: var(--g); box-shadow: 0 3px 0 var(--cd);
}
.num-tile { font-size: calc(var(--tile) * .5); }
.eq { display: flex; align-items: center; justify-content: center; gap: var(--gap); flex-wrap: wrap; max-width: 100%; }
.grp { padding: 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 110px; }
.grp-items { display: grid; grid-template-columns: repeat(var(--cols, 3), auto); gap: 4px 8px; justify-content: center; }
.grp-items .emo { font-size: clamp(2.1rem, 7vmin, 4.2rem); display: block; }
.grp-items.many .emo { font-size: clamp(1.8rem, 5.6vmin, 3.4rem); }
.grp-n { font-family: var(--font-read); font-weight: 700; font-size: clamp(1.6rem, 5vmin, 2.6rem); line-height: 1; color: var(--ci); }
.op { font-family: var(--font-read); font-weight: 700; font-size: clamp(2.6rem, 8vmin, 4.6rem); color: var(--ink); }
.q { min-width: clamp(90px, 15vmin, 140px); align-self: stretch; justify-content: center; }
.q-mark { font-family: var(--font-read); font-weight: 700; font-size: clamp(3rem, 10vmin, 5.5rem); line-height: 1; color: var(--ink-soft); }
.q-mark.got { color: var(--ci); }
.num-sentence { margin: 0; font-family: var(--font-read); font-weight: 700; font-size: clamp(1.9rem, 6vmin, 3.3rem); color: var(--ink); background: var(--paper); padding: 2px 26px; border-radius: 999px; box-shadow: 0 5px 0 var(--paper-edge); }
.leaving { animation: leave 1s .9s ease-in forwards; }
.cmp-row { display: flex; gap: calc(var(--gap) * 2); width: min(100%, 980px); flex: 1 1 auto; min-height: 200px; max-height: 540px; }
.cmp { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 3vmin; border: 6px solid transparent; }
.cmp.picked { border-color: var(--good); }
.cmp .grp-items { gap: 1.2vmin 2vmin; }
.cmp .grp-items .emo { font-size: clamp(2.8rem, 10vmin, 6rem); }
.cmp .grp-items.many .emo { font-size: clamp(2.2rem, 7.4vmin, 4.4rem); }
.cmp-big { font-family: var(--font-read); font-weight: 700; font-size: clamp(5rem, 22vmin, 12rem); line-height: 1; color: var(--ci); }

/* ---------- writing ---------- */
.write { flex: 1; width: 100%; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
.paper { flex: 1; min-height: 240px; position: relative; border-radius: var(--radius); background: var(--nb-paper); box-shadow: 0 8px 0 var(--paper-edge); overflow: hidden; touch-action: none; }
.paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.tools { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; flex: none; }
.crayons { display: flex; gap: 12px; padding: 0 6px; }
.crayon { width: 54px; height: 54px; border-radius: 50%; background: var(--c); border: 4px solid var(--paper); box-shadow: 0 5px 0 var(--cd); transition: transform .12s; }
.crayon.rainbow { background: conic-gradient(var(--red), var(--yellow), var(--green), var(--blue), var(--pink), var(--red)); box-shadow: 0 5px 0 var(--paper-edge); }
.crayon.on { transform: scale(1.18); outline: 4px solid var(--ink); outline-offset: 2px; }

/* ---------- stories ---------- */
.shelf { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--gap); width: min(100%, 1120px); }
.bookcover { display: flex; flex-direction: column; gap: 12px; transition: transform .1s; }
.bookcover.pressed { transform: translateY(5px); }
.cover-art {
  aspect-ratio: 3 / 4; border-radius: 10px 26px 26px 10px; background: var(--c); position: relative; display: grid; place-items: center;
  box-shadow: inset 14px 0 0 var(--cd), 0 10px 0 var(--cd), 0 16px 20px var(--shade); font-size: clamp(3rem, 11vmin, 6rem); overflow: hidden;
}
.cover-art .emo { font-size: inherit; }
.cover-art .pip-wrap { width: 62%; }
.cover-art .pip-wrap svg { width: 100%; height: auto; }
.cover-title { font-weight: 800; font-size: clamp(1.05rem, 2.6vmin, 1.5rem); color: var(--ink); text-align: center; text-wrap: balance; line-height: 1.15; }
.reader { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.reader-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.book-title { margin: 0; font-size: clamp(1.2rem, 3vmin, 1.8rem); font-weight: 800; color: var(--ink); text-wrap: balance; }
.book { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--gap); }
.page-side { background: var(--paper); border-radius: var(--radius); box-shadow: 0 8px 0 var(--paper-edge); padding: clamp(16px, 3vmin, 30px); display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-width: 0; }
.story-text { margin: 0; font-family: var(--font-read); font-size: clamp(1.45rem, 3.9vmin, 2.5rem); line-height: 1.5; color: var(--ink); }
.story-text .w { border-radius: 10px; padding: 0 .06em; transition: background .12s, color .12s; cursor: pointer; }
.story-text .w.hl { background: var(--hl); color: var(--hl-ink); }
.tell-note { display: block; font-family: var(--font-play); font-weight: 800; color: var(--pink-ink); }
.the-end { display: block; font-family: var(--font-play); font-weight: 800; font-size: 1.5em; color: var(--pink-ink); }
.reader-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.reader-nav .round { width: 72px; height: 72px; }
.reader-nav .round.pulse { animation: pulse 1.2s ease-in-out infinite; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 12px; height: 12px; border-radius: 6px; background: var(--paper-edge); transition: width .2s; }
.dots i.on { background: var(--pink); width: 30px; }
.fin { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.scene { position: relative; overflow: hidden; border-radius: var(--radius); min-height: 200px; --u: 3.4px; box-shadow: 0 8px 0 var(--paper-edge); touch-action: pan-y; }
.scene::before, .scene::after { content: ""; position: absolute; pointer-events: none; }
.scene > .it { position: absolute; z-index: 2; transform: translate(-50%, -50%); font-size: calc(var(--u) * var(--s)); line-height: 1; }
.scene > .it.flip { transform: translate(-50%, -50%) scaleX(-1); }
.scene > .it > span { display: block; }
.scene .pip-wrap { width: calc(var(--u) * var(--s)); }
.scene .pip-wrap svg { width: 100%; height: auto; overflow: visible; }
.scene.turn-next { animation: turnNext .35s ease-out; }
.scene.turn-prev { animation: turnPrev .35s ease-out; }
.bg-day { background: linear-gradient(180deg, var(--sc-day-top), var(--sc-day-low) 70%); }
.bg-day::after, .bg-gold::after, .bg-rain::after, .bg-dusk::after, .bg-night::after, .bg-snow::after, .bg-space::after { left: -12%; right: -12%; bottom: -30%; height: 54%; border-radius: 50%; background: var(--sc-grass); z-index: 1; }
.bg-gold { background: linear-gradient(180deg, var(--sc-gold-top), var(--sc-gold-low) 75%); }
.bg-rain { background: linear-gradient(180deg, var(--sc-rain-top), var(--sc-rain-low) 75%); }
.bg-dusk { background: linear-gradient(180deg, var(--sc-dusk-top), var(--sc-dusk-low) 78%); }
.bg-dusk::after { background: var(--sc-grass-dusk); }
.bg-night, .bg-space, .bg-seanight { background: linear-gradient(180deg, var(--sc-night-top), var(--sc-night-low) 80%); }
.bg-night::after { background: var(--sc-grass-night); }
.bg-space::after { background: var(--sc-moon); }
.bg-night::before, .bg-space::before, .bg-seanight::before {
  inset: 0 0 40% 0; z-index: 0;
  background-image:
    radial-gradient(2px 2px at 10% 20%, var(--sc-star) 50%, transparent 52%), radial-gradient(3px 3px at 30% 40%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(2px 2px at 52% 18%, var(--sc-star) 50%, transparent 52%), radial-gradient(2px 2px at 66% 52%, var(--sc-star) 50%, transparent 52%),
    radial-gradient(3px 3px at 88% 36%, var(--sc-star) 50%, transparent 52%), radial-gradient(2px 2px at 40% 66%, var(--sc-star) 50%, transparent 52%);
}
.bg-snow { background: linear-gradient(180deg, var(--sc-snow-top), var(--sc-day-low) 75%); }
.bg-snow::after { background: var(--sc-snow); }
.bg-sea { background: linear-gradient(180deg, var(--sc-day-top) 0, var(--sc-day-low) 44%, var(--sc-sea) 44%, var(--sc-sea) 80%, var(--sc-sand) 80%); }
.bg-seanight { background: linear-gradient(180deg, var(--sc-night-top) 0, var(--sc-night-low) 44%, var(--sc-sea-night) 44%, var(--sc-sea-night) 80%, var(--sc-sand-night) 80%); }
.it.bob > span { animation: bob 2.6s ease-in-out infinite; }
.it.hop > span { animation: hopLoop 1.6s ease-in-out infinite; }
.it.float > span { animation: floaty 3s ease-in-out infinite; }
.it.twinkle > span { animation: twinkle 1.8s ease-in-out infinite; }
.it.swim > span { animation: swim 3.4s ease-in-out infinite; }
.it.fly > span { animation: fly 2.4s ease-in-out infinite; }
.it.fall > span { animation: fall 2.2s ease-in infinite; }
.it.drift > span { animation: driftSmall 6s ease-in-out infinite alternate; }
.it.spin > span { animation: spin 14s linear infinite; }
.it.rock > span { animation: rock 3s ease-in-out infinite; }
.it.wiggle > span { animation: wiggle 1.4s ease-in-out infinite; }
.it.grow > span { animation: growIn 1.2s ease-out both; transform-origin: 50% 100%; }
.it.pulse > span { animation: heart 1.3s ease-in-out infinite; }
.it.glow > span { animation: glow 1.8s ease-in-out infinite; }
.trail { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.trail-dot {
  width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); box-shadow: 0 4px 0 var(--paper-edge);
  font-family: var(--font-read), var(--font-emoji); font-weight: 700; font-size: 1.6rem; color: var(--ink-soft);
}
.trail-dot.done { font-size: 2.1rem; }
.trail-dot.now { background: var(--c); color: var(--g); box-shadow: 0 4px 0 var(--cd); }
.trail-line { width: 22px; height: 4px; border-radius: 2px; background: var(--paper-edge); }
.make-choices { --tile: clamp(96px, min(17vmin, 25vw), 170px); }
.seq-slots { display: flex; gap: var(--gap); flex-wrap: wrap; justify-content: center; }
.seq-slot {
  width: calc(var(--tile) + 16px); min-height: calc(var(--tile) * 1.42); border-radius: var(--radius); border: 4px dashed var(--rule);
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; background: var(--paper);
}
.seq-slot.full { border-style: solid; border-color: var(--paper-edge); }
.seq-lbl { font-weight: 800; font-size: clamp(1.1rem, 2.8vmin, 1.5rem); color: var(--ci); }
.seq-slot .pic { box-shadow: none; min-height: calc(var(--tile) * .9); }
.seq-cap { font-family: var(--font-read); font-weight: 700; font-size: clamp(.95rem, 2.3vmin, 1.25rem); text-align: center; line-height: 1.2; color: var(--ink); }
.seq-cards { min-height: calc(var(--tile) + 20px); }

/* ---------- vocabulary ---------- */
.topics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); width: min(100%, 1000px); }
.topic {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px 6px; min-height: clamp(86px, 14vmin, 140px);
  border-radius: var(--radius); background: var(--c); color: var(--g); box-shadow: 0 8px 0 var(--cd); transition: transform .1s, box-shadow .1s;
}
.topic.pressed { transform: translateY(5px); box-shadow: 0 3px 0 var(--cd); }
.topic .emo { font-size: clamp(2.1rem, 6.8vmin, 3.8rem); }
.topic-name { font-weight: 800; font-size: clamp(.95rem, 2.3vmin, 1.25rem); text-align: center; line-height: 1.1; }
.flash { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: clamp(14px, 3vmin, 28px) clamp(24px, 6vmin, 64px); width: min(100%, 560px); }
.flash-emo { font-size: clamp(5.5rem, 24vmin, 12rem); line-height: 1.1; }
.flash-word { font-family: var(--font-read); font-weight: 700; font-size: clamp(2.6rem, 9vmin, 5rem); color: var(--ci); line-height: 1.1; }
.flash-sent { font-family: var(--font-read); font-size: clamp(1.2rem, 3.4vmin, 1.9rem); color: var(--ink); text-align: center; text-wrap: balance; }
.flash-nav { display: flex; align-items: center; gap: 24px; }
.flash-count { font-family: var(--font-read); font-weight: 700; font-size: 1.3rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.sort-item { padding: 10px 40px; display: flex; flex-direction: column; align-items: center; }
.sort-item .emo { font-size: clamp(4.2rem, 16vmin, 8.5rem); }
.sort-item .lbl, .gone-item .lbl { font-family: var(--font-read); font-weight: 700; color: var(--ink); }
.sort-item .lbl { font-size: clamp(1.6rem, 4.6vmin, 2.6rem); }
.baskets { display: flex; gap: calc(var(--gap) * 1.5); flex-wrap: wrap; justify-content: center; }
.basket {
  width: clamp(150px, 26vw, 280px); min-height: clamp(140px, 24vmin, 230px); border-radius: 24px 24px 44px 44px; background: var(--c); color: var(--g);
  box-shadow: 0 10px 0 var(--cd); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; transition: transform .1s;
}
.basket.pressed { transform: translateY(5px); }
.basket-top { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: clamp(1.05rem, 2.6vmin, 1.5rem); text-align: center; }
.basket-top .emo { font-size: 2em; }
.basket-in { flex: 1; width: 100%; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 4px; padding: 8px; border-radius: 16px; background: var(--carve); font-size: clamp(1.6rem, 4.6vmin, 2.6rem); }

/* ---------- spelling ---------- */
.mword { display: flex; gap: 8px; }
.ml {
  width: calc(var(--tile) * .6); height: calc(var(--tile) * .76); border-radius: 18px; background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge);
  display: grid; place-items: center; font-family: var(--font-read); font-weight: 700; font-size: calc(var(--tile) * .44); color: var(--ink);
}
.ml.gap { background: transparent; border: 4px dashed var(--rule); box-shadow: none; color: var(--ink-soft); }
.ml.got { background: var(--c); color: var(--g); box-shadow: 0 6px 0 var(--cd); }
.fam-word { display: flex; align-items: center; gap: 6px; font-family: var(--font-read); font-weight: 700; font-size: clamp(3rem, 11vmin, 6rem); line-height: 1; }
.fam-slot { min-width: 1.2em; height: 1.35em; padding: 0 .12em; border: 4px dashed var(--rule); border-radius: 18px; display: grid; place-items: center; color: var(--ink-soft); background: var(--paper); }
.fam-slot.got { border: 4px solid var(--cd); background: var(--c); color: var(--g); }
.fam-end { height: 1.35em; display: grid; place-items: center; padding: 0 .16em; border-radius: 18px; color: var(--ci); background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge); }
.fam-list { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.fam-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px 6px 10px; border-radius: 999px; background: var(--paper); box-shadow: 0 4px 0 var(--paper-edge);
  font-family: var(--font-read); font-weight: 700; font-size: clamp(1.1rem, 3vmin, 1.6rem); color: var(--ink);
}
.fam-chip .emo { font-size: 1.4em; }
.find-pic .rhyme-word { font-size: clamp(2rem, 7vmin, 4rem); }

/* ---------- memory ---------- */
.mem-grid { --mc: clamp(84px, min(19vmin, 20vw), 168px); display: grid; grid-template-columns: repeat(var(--cols), var(--mc)); gap: var(--gap); justify-content: center; }
.mem-grid.many { --mc: clamp(70px, min(15vmin, 20vw), 136px); }
.mem-card { width: var(--mc); height: calc(var(--mc) * 1.2); perspective: 900px; }
.mem-inner { position: relative; display: block; width: 100%; height: 100%; transition: transform .45s; -webkit-transform-style: preserve-3d; transform-style: preserve-3d; }
.mem-card.up .mem-inner { transform: rotateY(180deg); }
.mem-back, .mem-front {

/* ---------- thinking ---------- */

/* ---------- more games ---------- */

.kb { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; width: min(100%, 780px); }
.kb-key {
  height: clamp(46px, 8vmin, 66px); border-radius: 14px; background: var(--paper); box-shadow: 0 4px 0 var(--paper-edge);

}

.die.rolling { animation: wiggle .16s infinite; }
.tenframe { --tf: clamp(46px, 10vmin, 84px); display: grid; grid-template-columns: repeat(5, var(--tf)); gap: 6px; padding: 12px; }
.tenframe i { width: var(--tf); height: var(--tf); border: 3px solid var(--rule); border-radius: 12px; display: grid; place-items: center; }
.tenframe i.on::after { content: ""; width: 72%; height: 72%; border-radius: 50%; background: var(--red); }
.pat-row.nums { --pi: clamp(64px, min(13vmin, 15vw), 116px); }
.num-cell { font-family: var(--font-read); font-weight: 700; font-size: calc(var(--pi) * .48); color: var(--ink); }

/* ---------- family games ---------- */
.modes.single { visibility: hidden; }
.act-family .act-title { display: block; }
.fam-setup { width: min(100%, 1060px); padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }

.fam-count { min-width: 1.4em; text-align: center; font-family: var(--font-read); font-weight: 700; font-size: 2rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.round.fam-pm { width: 50px; height: 50px; font-size: 2rem; font-weight: 800; line-height: 1; }
.fam-setup .seg-b { height: 48px; min-width: 0; font-size: 1.05rem; }
.fam-names { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; }
.fam-name { display: inline-flex; align-items: center; gap: 6px; padding: 4px 5px 4px 10px; border-radius: 999px; background: var(--c); box-shadow: 0 4px 0 var(--cd); }

.fam-name input {
  width: 7.2em; font: 700 1.05rem var(--font-read); border: 0; border-radius: 999px; padding: 8px 12px; background: var(--paper); color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
.fam-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); width: min(100%, 1060px); }
.fam-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 6px; min-height: clamp(108px, 19vmin, 170px);
  border-radius: var(--radius); background: var(--c); color: var(--g); box-shadow: 0 8px 0 var(--cd); text-align: center; transition: transform .1s;
}

.fam-card-kind { font-family: var(--font-read); font-size: clamp(.8rem, 1.8vmin, .95rem); }
.fam-play { flex: 1; width: 100%; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.fam-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.fam-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.pill-btn.big { min-height: 74px; padding: 0 30px 0 22px; font-size: clamp(1.2rem, 3.2vmin, 1.7rem); }
.pill-btn.big .emo { font-size: 1.5em; }
.scorebar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; border-radius: 999px; background: var(--paper); color: var(--ink);
  box-shadow: inset 0 0 0 3px var(--c), 0 4px 0 var(--paper-edge); font-weight: 800; transition: transform .15s, opacity .2s;
}

.pchip-name { font-size: clamp(.95rem, 2.2vmin, 1.2rem); }

.fam-big { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: clamp(16px, 3vmin, 30px) clamp(20px, 5vmin, 48px); max-width: 100%; text-align: center; }
.fam-big > .emo { font-size: clamp(5rem, 22vmin, 11rem); line-height: 1.1; }

.freeze-pip { width: clamp(120px, 22vmin, 200px); }

.fam-balloon {
  width: clamp(110px, 20vmin, 170px); height: calc(clamp(110px, 20vmin, 170px) * 1.18); border-radius: 50% 50% 47% 47% / 56% 56% 44% 44%;
  background: radial-gradient(circle at 32% 26%, var(--carve) 0 9%, transparent 10%), var(--red); box-shadow: inset -10px -14px 0 var(--shade); transform-origin: 50% 80%;
}

.bal-ex { display: flex; gap: 10px; font-size: clamp(2rem, 6vmin, 3rem); }
.gwho { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px 8px 12px; border-radius: 999px; background: var(--c); color: var(--g); box-shadow: 0 5px 0 var(--cd); font-weight: 800; font-size: clamp(1.1rem, 2.8vmin, 1.5rem); }
.gwho .emo { font-size: 1.8em; }
/* race games */
.race { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.race-row { flex: 1 1 0; min-height: 0; display: flex; gap: 10px; }
.race-row.flip .race-panel { transform: rotate(180deg); }
.race-panel {
  flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 22px; background: var(--paper);
  box-shadow: inset 0 0 0 5px var(--c), 0 6px 0 var(--paper-edge); transition: background .2s;
}
.rp-head { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: clamp(1rem, 2.4vmin, 1.35rem); color: var(--ink); }

.rp-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-score { margin-left: auto; min-width: 2em; padding: 2px 10px; border-radius: 999px; background: var(--c); color: var(--g); text-align: center; font-variant-numeric: tabular-nums; }
.rp-opts { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity .2s; }
.rp-opt {
  width: var(--ro, 96px); height: var(--ro, 96px); border-radius: 20px; background: var(--guide-fill); box-shadow: 0 5px 0 var(--paper-edge);
  display: grid; place-items: center; font-family: var(--font-read); font-weight: 700; font-size: calc(var(--ro, 96px) * .5); color: var(--ink); transition: transform .08s;
}
.rp-opt.pressed { transform: translateY(3px); }
.rp-opt .emo { font-size: calc(var(--ro, 96px) * .62); }
.rp-opts.wide .rp-opt { width: calc(var(--ro, 96px) * 1.5); font-size: calc(var(--ro, 96px) * .3); }
.race-panel.won { background: var(--c); }
.race-panel.won .rp-head { color: var(--g); }
.race-panel.won .rp-score { background: var(--paper); color: var(--ink); }
.race-panel.locked .rp-opts, .race-panel.wrong .rp-opts { opacity: .35; }
.race-panel.right { box-shadow: inset 0 0 0 9px var(--good), 0 6px 0 var(--paper-edge); }
.race-panel.show .rp-opt.ans { box-shadow: 0 0 0 6px var(--good), 0 5px 0 var(--paper-edge); }
.race-center { flex: none; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
.rc-q { display: flex; align-items: center; gap: 12px; padding: 4px 22px; border-radius: 22px; background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge); font-family: var(--font-read); font-weight: 700; font-size: clamp(1.8rem, 5.6vmin, 3.4rem); color: var(--ink); line-height: 1.2; }
.rc-q.rot { transform: rotate(180deg); }
.rc-q .emo { font-size: 1.25em; }
.rc-dots { font-size: .7em; letter-spacing: .04em; }
.rc-yn { display: inline-flex; align-items: center; gap: 12px; }
.rc-round { font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
/* garden race */
.garden { flex: 1; min-height: 0; display: flex; gap: 14px; }
.gboard-wrap { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.gstart { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 4px 14px; border-radius: 999px; background: var(--paper); box-shadow: 0 4px 0 var(--paper-edge); font-weight: 800; color: var(--ink); }
.gstart .gtok { font-size: 1.8rem; }
.gboard { --gc: 90px; display: grid; grid-template-columns: repeat(6, var(--gc)); grid-template-rows: repeat(4, var(--gc)); gap: 6px; }
.gcell { position: relative; border-radius: 14px; background: var(--paper); box-shadow: 0 4px 0 var(--paper-edge); display: flex; flex-direction: column; align-items: center; padding: 4px; min-width: 0; }
.gcell.alt { background: var(--guide-fill); }

.gnum { align-self: flex-start; font-family: var(--font-read); font-weight: 700; font-size: calc(var(--gc) * .2); line-height: 1; color: var(--ink-soft); }
.gcell.finish .gnum { align-self: center; font-size: calc(var(--gc) * .36); }
.gspecial { position: absolute; right: 4px; top: 3px; font-size: calc(var(--gc) * .24); line-height: 1; }
.gtok { flex: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; font-size: calc(var(--gc) * .3); line-height: 1; }
.gtok .emo.me { filter: drop-shadow(0 0 5px var(--yellow)); transform: scale(1.18); }
.gside { width: clamp(200px, 25vw, 280px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.glegend { font-family: var(--font-read); font-size: .95rem; color: var(--ink-soft); text-align: center; }
.gq { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); z-index: 5; width: min(92%, 640px); padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 12px 0 var(--paper-edge), 0 20px 40px var(--shade); }
.gq-q { font-family: var(--font-read); font-weight: 700; font-size: clamp(2rem, 6vmin, 3.4rem); color: var(--ink); }

.gq-opt { --tile: clamp(84px, 14vmin, 130px); }
.gq-opt > span { font-family: var(--font-read); font-weight: 700; font-size: calc(var(--tile) * .45); color: var(--ink); }

@media (orientation: portrait) {
  .garden { flex-direction: column; }
  .gside { width: 100%; flex-direction: row; flex-wrap: wrap; }
}
@media (max-width: 520px) {
  .fam-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}

/* ---------- stickers ---------- */

  font-family: var(--font-emoji); font-size: clamp(2.2rem, 7vmin, 3.6rem); transition: transform .1s;
}

.st.locked { background: transparent; box-shadow: none; border: 4px dashed var(--rule); color: var(--ink-soft); font-family: var(--font-play); font-weight: 800; font-size: 1.6rem; }

/* ---------- grown-ups ---------- */
.gu-title { margin: 0; font-size: clamp(1.5rem, 3.6vmin, 2.1rem); font-weight: 800; }
.gu { width: min(100%, 760px); margin: 0 auto; display: grid; gap: 18px; padding-bottom: 28px; }

.seg { display: flex; gap: 10px; flex-wrap: wrap; }

.seg-b.on { background: var(--blue); color: var(--white); box-shadow: 0 4px 0 var(--blue-deep); }
.gu-input {
  font: 700 1.3rem var(--font-read); padding: 14px 16px; border-radius: 16px; border: 3px solid var(--rule); background: var(--paper); color: var(--ink);
  width: min(100%, 360px); -webkit-user-select: text; user-select: text;
}
.sw-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.sw-row span { font-family: var(--font-read); font-size: 1.1rem; font-weight: 700; }
.sw { width: 76px; height: 44px; border-radius: 999px; background: var(--rule); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 5px; left: 5px; width: 34px; height: 34px; border-radius: 50%; background: var(--white); transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--green); }
.sw[aria-checked="true"]::after { transform: translateX(32px); }
.gu-tips { margin: 0; padding-left: 1.2em; font-family: var(--font-read); font-size: 1.05rem; line-height: 1.55; color: var(--ink-soft); display: grid; gap: 6px; }
.gu-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.pill-btn.danger { background: var(--red); color: var(--white); box-shadow: 0 5px 0 var(--red-deep); }

/* ---------- overlay & effects ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--scrim); padding: 24px; animation: fadeIn .2s; }
.overlay.out { opacity: 0; transition: opacity .25s; }
.ov-card { background: var(--paper); border-radius: 40px; padding: clamp(20px, 4vmin, 40px) clamp(28px, 6vmin, 64px); text-align: center; box-shadow: 0 12px 0 var(--paper-edge); display: grid; gap: 6px; justify-items: center; max-width: 100%; }
.ov-kicker { margin: 0; font-size: clamp(1.6rem, 5vmin, 2.6rem); font-weight: 800; color: var(--pink-ink); }

.ov-name { margin: 0; font-size: clamp(1.4rem, 4vmin, 2.2rem); font-weight: 800; }
.ov-hint { margin: 0; font-family: var(--font-read); color: var(--ink-soft); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
.bit { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 3px; }

.fly-star { position: absolute; width: 48px; height: 48px; }
.fly-star svg { width: 100%; height: 100%; }

.shake { animation: shake .5s; }

/* ---------- responsive ---------- */
@media (orientation: portrait) {
  .lt-learn { grid-template-columns: minmax(0, 1fr); align-content: center; }
  .lt-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .book { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 1.25fr) auto; }

}
@media (max-width: 900px) { .act-title { display: none; } }
@media (max-width: 760px) {
  .mode { padding: 0 14px 0 7px; min-height: 52px; }
  .mode-ic { width: 36px; height: 36px; }
  .round { width: 56px; height: 56px; }
  .stars-pill { height: 52px; font-size: 1.3rem; }

}

  .blocks { --bs: clamp(96px, 36vw, 150px); }
  .ages { display: grid; grid-template-columns: repeat(2, auto); }

  .mode { padding: 0 7px; }
  .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .crayon { width: 44px; height: 44px; }
}

/* ---------- motion ---------- */
@keyframes drift { from { translate: 0 0; } to { translate: 14vw 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6%); } }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-18%) scale(1.05, .95); } 60% { transform: translateY(0) scale(1.08, .92); } }

  // A board game: roll the dice and race along the path to the flower garden.
  function famGarden(g) {
    const { stage, api, ps } = g, N = 24, lv = famLevel(), dieMax = lv === 1 ? 3 : 6;
    const SPECIAL = { 3: '⭐', 6: '❓', 8: '🐌', 11: '🌈', 13: '❓', 16: '⭐', 18: '🐌', 20: '❓', 22: '🌈' };
    const pos = ps.map(() => 0); let turn = 0, busy = false;
    const sb = scoreBoard(ps, true); sb.turn(0);
    const cellEls = {};
    const board = el('div', { class: 'gboard' });
    for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) {
      const n = r * 6 + (r % 2 ? 6 - c : c + 1);
      const cell = el('div', { class: 'gcell' + (n % 2 ? '' : ' alt') + (n === N ? ' finish' : '') },
        el('span', { class: 'gnum' }, n === N ? '🌻' : String(n)), SPECIAL[n] ? el('span', { class: 'gspecial' }, SPECIAL[n]) : null, el('span', { class: 'gtok' }));
      cellEls[n] = cell; board.append(cell);
    }
    const start = el('div', { class: 'gstart' }, el('span', null, 'Start'), el('span', { class: 'gtok' }));
    let die = dieFace(1);
    const dieHolder = el('div', { class: 'die-holder' }, die);
    const who = el('div', { class: 'gwho' });
    const rollBtn = el('button', { class: 'pill-btn big', ontap: roll }, el('span', { class: 'emo' }, '🎲'), el('span', null, 'Roll'));
    const legend = el('div', { class: 'glegend' }, '⭐ hop 2 · 🐌 back 2 · 🌈 roll again · ❓ question');
    const bw = el('div', { class: 'gboard-wrap' }, start, board);
    stage.replaceChildren(famFrame(g, [sb.node, el('div', { class: 'garden' }, bw, el('div', { class: 'gside' }, who, dieHolder, rollBtn, legend))]));
    function setDie(n) { const d = dieFace(n); dieHolder.replaceChildren(d); die = d; }
    function draw() {
      Object.keys(cellEls).forEach(k => $('.gtok', cellEls[k]).replaceChildren());
      $('.gtok', start).replaceChildren();
      ps.forEach((p, k) => { const tgt = pos[k] === 0 ? start : cellEls[Math.min(N, pos[k])]; $('.gtok', tgt).append(el('span', { class: 'emo' + (k === turn ? ' me' : '') }, p.e)); });
      who.replaceChildren(el('span', { class: 'emo' }, ps[turn].e), el('span', null, `${ps[turn].name}’s turn`)); who.setAttribute('style', colorVars(ps[turn].color));
    }
    function fit() {
      const w = bw.clientWidth, h = bw.clientHeight - start.offsetHeight - 10;
      board.style.setProperty('--gc', Math.max(40, Math.min((w - 30) / 6, (h - 18) / 4, 130)) + 'px');
    }
    requestAnimationFrame(fit);
    const onResize = () => { if (!board.isConnected) { window.removeEventListener('resize', onResize); return; } fit(); };
    window.addEventListener('resize', onResize);
    function roll() {
      if (busy) return; busy = true; Sfx.pop();
      let k = 0;

      spin();

        later(() => move(turn, r, () => land(turn)), 800);

    function move(k, steps, done) {

      const s = SPECIAL[pos[k]];

      if (s === '🐌') { api.ask('Oh no, a snail! Slide back 2.', null, () => move(k, -2, nextTurn)); return; }
      if (s === '🌈') { busy = false; draw(); api.ask(`A rainbow! ${ps[k].name}, roll again!`); return; }

    api.ask(`Race to the flower garden! ${ps[0].name} goes first. Tap Roll!`);
  }

  // Charades: one player acts out a secret picture, everyone else guesses.

    const { stage, api, ps } = g, lv = famLevel(), TURNS = ps.length * 2;
    const topics = [['Zoo Animals', 'Farm Animals', 'Things That Go'], ['Zoo Animals', 'Farm Animals', 'Things That Go', 'Actions', 'Ocean'], ['Actions', 'Jobs', 'Feelings', 'Zoo Animals', 'Music', 'Toys']][lv - 1];

    const sb = scoreBoard(ps); let turn = 0, played = 0; const used = [];
    const area = el('div', { class: 'fam-stage-area' });

      run: { count: numbersCount, dots: numbersDots, add: numbersAdd, sub: numbersSub, more: numbersMore, missing: numbersMissing } },
    write: { title: 'Writing', color: 'blue', face: () => el('span', { class: 'face-svg', html: ICON.pencil }),
      modes: [{ id: 'shapes', label: 'Lines', icon: '〰️' }, { id: 'upper', label: 'ABC', icon: 'A' }, { id: 'lower', label: 'abc', icon: 'a' }, { id: 'num', label: '123', icon: '1' }, { id: 'name', label: 'Names', icon: '😊', when: () => kidNames().length > 0 }],
      def: () => ['shapes', 'upper', 'upper', 'lower'][level() - 1],
      run: { shapes: writeRun('shapes'), upper: writeRun('upper'), lower: writeRun('lower'), num: writeRun('num'), name: writeRun('name') } },
    stories: { title: 'Stories', color: 'pink', face: () => el('span', { class: 'face-svg', html: ICON.book }),
      modes: [{ id: 'read', label: 'Story time', icon: '📖' }, { id: 'make', label: 'Make a story', icon: '✨' }, { id: 'order', label: 'What’s first?', icon: '1' }],
      run: { read: storiesRead, make: storiesMake, order: storiesOrder } },
    memory: { title: 'Memory', color: 'teal', face: () => el('span', { class: 'face-emo duo' }, '🐸🐸'),
      modes: [{ id: 'match', label: 'Match pairs', icon: '🃏' }, { id: 'gone', label: 'What’s gone?', icon: '👀' }, { id: 'copy', label: 'Copy Pip', icon: '🎵' }],
      run: { match: memoryMatch, gone: memoryGone, copy: memoryCopy } },
    think: { title: 'Thinking', color: 'wood', face: () => el('span', { class: 'face-emo solo' }, '🧩'),
      modes: [{ id: 'pattern', label: 'What’s next?', icon: '🔁' }, { id: 'odd', label: 'Odd one out', icon: '🤔' }, { id: 'shadow', label: 'Shadows', icon: '👤' }],
      run: { pattern: thinkPattern, odd: thinkOdd, shadow: thinkShadow } },
    family: { title: 'Family Games', color: 'navy', face: () => el('span', { class: 'face-emo solo' }, '👨‍👩‍👧‍👦'),
      modes: [{ id: 'play', label: 'Play', icon: '🎲' }], run: { play: familyHub } }
  };

  /* ================= screens ================= */
  const App = {
    cur: null,
    go(name, arg) {
      screenToken++;
      Speech.stop(); Music.stop();
      document.querySelectorAll('.overlay').forEach(o => o.remove());
      const v = $('#view'); v.replaceChildren();
      this.cur = { name, arg: arg || {} };
      (SCREENS[name] || SCREENS.home)(v, this.cur.arg);
    }
  };
  function screenStart(v) {
    const ages = [[1, '2', 'red'], [2, '3', 'yellow'], [3, '4', 'green'], [4, '5+', 'blue']];
    const word = 'Play Garden';
    v.append(el('section', { class: 'screen start' },
      el('div', { class: 'start-hero' },
        el('div', { class: 'start-pip', html: pipSVG() }),
        el('h1', { class: 'logo' }, el('span', { class: 'logo-small' }, 'Ivy & Ryan’s'),
          el('span', { class: 'logo-big' }, word.split('').map((ch, k) => ch === ' ' ? ' ' : el('span', { style: `color:var(--${COLORS[k % 5]}-ink)` }, ch))))),
      el('div', { class: 'start-card' },
        el('p', { class: 'start-ask' }, 'How old are you?'),
        el('div', { class: 'ages' }, ages.map(a => el('button', { class: 'age' + (Store.data.lastAge === a[0] ? ' last' : ''), style: colorVars(a[2]), 'aria-label': 'I am ' + a[1], ontap: () => begin(a[0], a[1]) },
          el('span', { class: 'candles', 'aria-hidden': 'true' }, Array.from({ length: a[0] + 1 }, () => el('i', { class: 'candle' }))),
          el('span', { class: 'age-n' }, a[1])))),
        el('p', { class: 'start-note' }, 'Tap an age to start. Turn the sound on!'))));
    function begin(lv, label) {
      Sfx.unlock(); Sfx.good();
      Store.data.level = lv; Store.data.lastAge = lv; Store.save();
      App.go('home', { greeted: true });
      Speech.say(`${label === '5+' ? 'Five and up' : NUM[+label]}! Hi, I'm Pip. Welcome to Ivy and Ryan's Play Garden. Let's play!`);
    }
  }
  function holdButton(onDone) {
    const ring = el('span', { class: 'hold-ring', html: '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/></svg>' });
    const b = el('button', { class: 'round gear', 'aria-label': 'Grown-ups: press and hold' }, el('span', { class: 'ic', html: ICON.gear }), ring);
    let t = null;
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('holding'); t = setTimeout(() => { t = null; b.classList.remove('holding'); onDone(); }, 1600); });
    const stop = () => { if (t) { clearTimeout(t); t = null; b.classList.remove('holding'); restart(b, 'nope'); } };
    b.addEventListener('pointerup', stop); b.addEventListener('pointercancel', stop); b.addEventListener('pointerleave', stop);
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onDone(); } });
    b.addEventListener('contextmenu', e => e.preventDefault());
    return el('div', { class: 'hold-wrap' }, b, el('span', { class: 'hold-lbl' }, 'Grown-ups: hold'));
  }
  function screenHome(v, arg) {
    const pipB = el('button', { class: 'pip-btn', 'aria-label': 'Pip', html: pipSVG(), ontap: () => { hop(pipB); Speech.say(pick(['Tap a block to play!', 'What do you want to play?', 'Let’s learn something fun!'])); } });
    const d = Store.data;
    const latest = d.stickers ? STICKERS[Math.min(d.stickers, STICKERS.length) - 1][0] : '🌟';
    v.append(el('section', { class: 'screen home' },
      el('header', { class: 'bar' },
        el('div', { class: 'prompt grow' }, pipB, el('div', { class: 'bubble' }, 'What do you want to play?')),
        el('button', { class: 'sticker-btn', 'aria-label': 'My stickers', ontap: () => { Sfx.pop(); App.go('stickers'); } },
          el('span', { class: 'sb-emo' }, latest), el('span', { class: 'star-ic', html: ICON.star }), el('span', { class: 'sp-n' }, String(d.stars))),
        holdButton(() => App.go('grown'))),
      el('main', { class: 'blocks' }, Object.keys(ACTS).map(id => {
        const A = ACTS[id];
        return el('button', { class: 'block', style: colorVars(A.color), 'aria-label': A.title, ontap: () => { Sfx.pop(); App.go('act', { id }); } },
          el('span', { class: 'block-face' }, A.face()), el('span', { class: 'block-label' }, A.title));
      }))));
    if (!arg.greeted) Speech.say('What do you want to play?');
  }
  function screenAct(v, arg) {
    const A = ACTS[arg.id] || ACTS.letters, id = ACTS[arg.id] ? arg.id : 'letters';
    const modes = A.modes.filter(m => !m.when || m.when());
    const mode = modes.some(m => m.id === arg.mode) ? arg.mode : (A.def ? A.def() : modes[0].id);
    App.cur.arg = { id, mode };
    const prompt = promptRow();
    const stage = el('main', { class: 'stage' });
    v.append(el('section', { class: 'screen act act-' + id, style: colorVars(A.color) },
      el('header', { class: 'bar' },
        roundBtn('home', 'Home', () => App.go('home')),
        el('h1', { class: 'act-title' }, A.title),
        el('nav', { class: 'modes' + (modes.length < 2 ? ' single' : ''), 'aria-label': A.title + ' games' }, modes.map(m => el('button', { class: 'mode' + (m.id === mode ? ' on' : ''), 'aria-pressed': String(m.id === mode),
          ontap: () => { if (m.id !== mode) { Sfx.pop(); App.go('act', { id, mode: m.id }); } } }, el('span', { class: 'mode-ic', 'aria-hidden': 'true' }, m.icon), el('span', { class: 'mode-lbl' }, m.label)))),
        starsPill()),
      prompt.node, stage));
    A.run[mode](stage, makeApi(prompt));
  }
  function screenStickers(v) {
    const d = Store.data, got = Math.min(d.stickers, STICKERS.length);
    const left = 5 - (d.stars % 5);
    const prompt = promptRow();
    const grid = el('div', { class: 'st-grid' }, STICKERS.map((s, k) => k < got
      ? el('button', { class: 'st', 'aria-label': s[1], ontap: e => { Sfx.pop(); bounce(e.currentTarget || grid.children[k]); Speech.say(`${art(s[1]) === 'an' ? 'An' : 'A'} ${s[1]}!`); } }, s[0])
      : el('div', { class: 'st locked', 'aria-label': 'Locked sticker' }, '?')));
    const stage = el('main', { class: 'stage' }, grid);
    v.append(el('section', { class: 'screen' },
      el('header', { class: 'bar' }, roundBtn('home', 'Home', () => App.go('home')), el('h1', { class: 'st-title grow' }, 'My Stickers'), starsPill()),
      prompt.node, stage));
    if (got >= STICKERS.length) prompt.set('You found every sticker! Wow!');
    else if (got) prompt.set(`You have ${got} sticker${got === 1 ? '' : 's'}! ${left} more star${left === 1 ? '' : 's'} for the next one.`);
    else prompt.set(`Play games to win stars. ${left} stars get a sticker!`);
  }
  function screenGrown(v) {
    const d = Store.data;
    const LV = {
      1: 'Age 2: two choices at a time, lines and shapes in the notebook, first sounds, counting to 3, 2 memory pairs, simple AB patterns.',
      2: 'Age 3: capital letters, three choices, spelling three-letter words with hints, counting to 5, 3 memory pairs.',
      3: 'Age 4: lowercase letters, reading without the voice, missing letters anywhere in a word, adding, 4 memory pairs, longer patterns.',
      4: 'Age 5 and up: four- and five-letter spelling, taking away, numbers to 20, 6 memory pairs, sorting into three groups.'
    };
    const info = el('p', { class: 'gu-note' }, LV[level()]);
    const segBtns = [[1, '2'], [2, '3'], [3, '4'], [4, '5+']].map(a => el('button', { class: 'seg-b' + (level() === a[0] ? ' on' : ''), role: 'radio', 'aria-checked': String(level() === a[0]), 'aria-label': 'Age ' + a[1],
      ontap: () => { d.level = a[0]; d.lastAge = a[0]; Store.save(); segBtns.forEach((b, k) => { const on = k + 1 === a[0]; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); }); info.textContent = LV[a[0]]; } }, a[1]));
    const toggle = (key, label) => {
      const b = el('button', { class: 'sw', role: 'switch', id: 'sw-' + key, 'aria-checked': String(!!d[key]), 'aria-label': label,
        ontap: () => { d[key] = !d[key]; Store.save(); b.setAttribute('aria-checked', String(!!d[key])); if (key === 'sfx' && d.sfx) Sfx.pop(); } });
      return el('div', { class: 'sw-row' }, el('span', null, label), b);
    };
    const progress = el('p', { class: 'gu-note' }, `${d.stars} stars and ${d.stickers} stickers so far.`);
    const resetRow = el('div', { class: 'gu-row' });
    const showReset = () => resetRow.replaceChildren(el('button', { class: 'pill-btn ghost', ontap: confirmReset }, 'Start over'));
    function confirmReset() {
      resetRow.replaceChildren(
        el('button', { class: 'pill-btn danger', ontap: () => { d.stars = 0; d.stickers = 0; Store.save(); progress.textContent = 'Stars and stickers cleared.'; showReset(); } }, 'Yes, clear stars and stickers'),
        el('button', { class: 'pill-btn ghost', ontap: showReset }, 'Keep them'));
    }
    showReset();
    v.append(el('section', { class: 'screen grown' },
      el('header', { class: 'bar' }, roundBtn('home', 'Back to the game', () => App.go('home', { greeted: true })), el('h1', { class: 'gu-title' }, 'Grown-ups')),
      el('div', { class: 'gu' },
        el('div', { class: 'gu-card' }, el('h2', null, 'Age level'), el('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Age level' }, segBtns), info),
        el('div', { class: 'gu-card' }, el('h2', null, 'Children’s first names'),
          el('p', { class: 'gu-note' }, 'Separate names with a comma. They appear in Writing (Names) and as heroes in Make a story. Names stay on this device.'),
          el('input', { id: 'kid-name', class: 'gu-input', type: 'text', maxlength: '40', autocomplete: 'off', autocapitalize: 'words', spellcheck: 'false', placeholder: 'Ivy, Ryan', value: d.name || '',
            oninput: e => { d.name = e.target.value.replace(/\s+/g, ' ').slice(0, 40); Store.save(); } })),
        el('div', { class: 'gu-card' }, el('h2', null, 'Play without internet'),
          el('p', { class: 'gu-note' }, navigator.serviceWorker && navigator.serviceWorker.controller
            ? 'Ready. This device has saved the game, so it plays with no internet at home or on the go.'
            : 'Open the game from its own web link in Safari, then tap Share and Add to Home Screen. After one visit online it plays with no internet. The Claude preview link always needs internet.')),
        el('div', { class: 'gu-card' }, el('h2', null, 'Sound'), toggle('autoread', 'Read stories aloud by themselves'), toggle('slow', 'Slower voice'), toggle('sfx', 'Sound effects')),
        el('div', { class: 'gu-card' }, el('h2', null, 'Progress'), progress, resetRow),
        el('div', { class: 'gu-card' }, el('h2', null, 'Tips'),
          el('ul', { class: 'gu-tips' },
            el('li', null, 'Play together. Say the words out loud with your child.'),
            el('li', null, 'Ten to fifteen minutes is plenty for little ones.'),
            el('li', null, 'On the go: Memory, Pop it, Show me and What’s next? are quick games that work well in short bursts.'),
            el('li', null, 'At home: Writing, Stories and Make a story work best sitting together, with your child talking about the pictures.'),
            el('li', null, 'Family Games: lay the iPad flat in the middle of the table. With 4 or more players, half the panels turn to face the other side.'),
            el('li', null, 'No sound? Turn up the volume and check the iPad’s silent mode.'),
            el('li', null, 'To keep your child inside the game, turn on Guided Access in Settings, then Accessibility.'),
            el('li', null, 'In Safari, tap Share, then Add to Home Screen, to open the game like an app.'))))));
  }
  const SCREENS = { start: screenStart, home: screenHome, act: screenAct, stickers: screenStickers, grown: screenGrown };

  /* ================= start-up ================= */
  document.addEventListener('pointerdown', () => { Sfx.unlock(); Speech.unlock(); }, true);
  document.addEventListener('keydown', () => { Sfx.unlock(); Speech.unlock(); }, true);
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Speech.stop(); Music.stop(); } });
  const themeChanged = () => window.dispatchEvent(new Event('themechange'));
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', themeChanged); }
  if (window.MutationObserver) new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function boot(data) {
    Store.load(); Speech.init();
    const s = data && data.screen;
    if (s && SCREENS[s.name] && s.name !== 'start') App.go(s.name, s.arg); else App.go('start');
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ screen: App.cur }));
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
